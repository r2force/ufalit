<section class="reading-room library-collection">
  <a class="library-back" href="../reading/">Все литераторы</a>
  <div class="library-collection-layout">
    <aside class="library-profile">
      <img src="$portrait" alt="Портрет: $name" width="280" height="350" sizes="(max-width: 45rem) 6.5rem, clamp(15rem, 26vw, 21rem)">
      <div><p class="library-years">$years</p><h1>$name</h1><p class="library-role">$role</p><a href="../personalities/#person-$writer">Биография и библиография</a>$group_links</div>
    </aside>
    <div class="library-shelf">
      <header class="library-shelf-heading"><h2>$shelf_title</h2><p>$intro</p>$notes</header>
      $works
      $audio
      <nav class="library-other-authors" aria-label="Другие литераторы"><h2>Другие литераторы</h2><div>$authors</div></nav>
    </div>
  </div>
</section>
