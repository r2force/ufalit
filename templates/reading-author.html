<section class="reading-room library-collection">
  <a class="library-back" href="../reading/">Все литераторы</a>
  <div class="library-collection-layout">
    <aside class="library-profile">
      <img src="$portrait" alt="Портрет: $name" width="280" height="350">
      <div><p class="library-years">$years</p><h1>$name</h1><p class="library-role">$role</p><a href="../personalities/#person-$writer">Биография и библиография</a></div>
    </aside>
    <div class="library-shelf">
      <header class="library-shelf-heading"><h2>Произведения и материалы</h2><p>$intro</p></header>
      <ul class="library-works">$works</ul>
      $audio
      <nav class="library-other-authors" aria-label="Другие литераторы"><h2>Другие литераторы</h2><div>$authors</div></nav>
    </div>
  </div>
</section>
