<summary><img src="$thumbnail" alt="" loading="lazy" width="40" height="50"><span>$name<small>$years</small></span></summary>
<header class="person-profile-heading">
  <img class="person-profile-portrait" src="$portrait" alt="" loading="lazy">
  <div class="person-profile-info">
    <div class="person-profile-meta"><span class="person-profile-years">$years</span><p class="person-role">$role</p></div>
    <h2 class="person-title">$name</h2>$full_name
    <p class="person-connection"><strong>Связь с Уфой:</strong> $ufa</p>
    <nav class="related-links" aria-label="Связанные материалы">
      <a class="profile-gallery-link" href="$gallery_url">$gallery_label</a>
      <a class="profile-places-link" href="$places_url">Памятные места</a>
      <a class="profile-reading-link" href="$reading_url">Читальный зал</a>$audio_link
    </nav>
  </div>
</header>
