<figure id="$id" data-category="$category" data-writer="$writer" data-writer-name="$writer_name" data-gallery-order="$order">
<div class="photo-register"><span class="photo-author">$writer_name</span><span class="photo-category">$category</span></div>
<a class="photo-stage" href="$src"$link_attrs><span class="photo-mat"><img src="$src" alt="$alt"$image_attrs></span><span class="photo-open" aria-hidden="true">Открыть ↗</span></a>
<figcaption>$caption$note<div class="photo-footer"><span class="photo-metadata">$metadata</span><a class="photo-original" href="$src" target="_blank" rel="noopener">Оригинал ↗</a></div></figcaption>
</figure>
