<a class="archive-collection archive-collection--$writer" href="$href" aria-label="$name — $count. Открыть коллекцию">
  <div class="archive-collection-object">
    <div class="archive-portrait-film" aria-hidden="true">
      <span class="archive-film-edge">Литературная коллекция</span>
      <img src="$portrait" alt="" width="320" height="300">
      <span class="archive-film-edge archive-film-edge--bottom">Уфа литературная <span>MP4</span></span>
    </div>
    <div class="archive-can-scene" aria-hidden="true">
      <span class="archive-can-tail"></span>
      <span class="archive-can">
        <span class="archive-can-lid">
          <span class="archive-can-label"><span>Литературный киноархив</span><strong>$name</strong><span class="archive-can-label-count">$count</span><span class="archive-can-stamp">Видеоколлекция</span></span>
        </span>
      </span>
    </div>
  </div>
  <div class="archive-collection-info"><p class="archive-collection-count">$count</p><h3>$name</h3><span class="archive-open"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M7 4.5 15 10l-8 5.5Z" fill="currentColor"/></svg>Открыть коллекцию</span></div>
</a>
