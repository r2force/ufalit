name: Publish site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'templates/**'
      - 'scripts/render_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-meta.outputs.artifact_name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Build static pages
        run: python3 scripts/render_site.py --in-place
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Set artifact name
        id: artifact-meta
        run: echo "artifact_name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload only site directory
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name || format('github-pages-{0}', github.run_attempt) }}
        run: |
          count=0
          for delay in 1 2 4 8 15; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false)] | length' || echo 0)
            if [ "$count" = "1" ]; then
              break
            fi
            sleep "$delay"
          done
          if [ "$count" != "1" ]; then
            echo "Artifact ${ARTIFACT_NAME} is not uniquely visible yet (count=${count})." >&2
            exit 1
          fi
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name || format('github-pages-{0}', github.run_attempt) }}
