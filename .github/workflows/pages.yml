name: Publish site to GitHub Pages
on:
  push:
    branches:
      - main
      - 'arena/**'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  queue: max
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-meta.outputs.artifact_name }}
    steps:
      - name: Checkout site and Git LFS media
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Verify available MP4 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('site/assets/video').rglob('*.mp4'))
          for file in files:
              with file.open('rb') as stream:
                  header = stream.read(128)
              if header.startswith(b'version https://git-lfs.github.com/spec/') or file.stat().st_size < 1024:
                  raise SystemExit(f'MP4 is not materialized: {file}')
          print(f'Verified {len(files)} materialized MP4 files')
          PY
      - name: Test home map
        run: node scripts/test_home_map.js
      - name: Test protected email contacts
        run: |
          python3 scripts/test_email_contacts.py
          node scripts/test_email_contacts.js
      - name: Test video archive
        run: python3 scripts/test_video_archive.py
      - name: Test photo gallery
        run: python3 scripts/test_gallery.py
      - name: Test reading room
        run: python3 scripts/test_reading_room.py
      - name: Test reading search
        run: node scripts/test_reading_search.js
      - name: Test analytics goals
        run: node scripts/test_analytics.js
      - name: Build static pages
        run: python3 scripts/render_site.py --in-place
      - name: Test SEO on built pages
        run: python3 scripts/test_seo.py --site site
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Set artifact name
        id: artifact-meta
        run: echo "artifact_name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload only site directory
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          path: site
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.deleted }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name || format('github-pages-{0}', github.run_attempt) }}
        run: |
          count=0
          for delay in 1 2 4 8 15; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false)] | length' || echo 0)
            if [ "$count" = "1" ]; then
              break
            fi
            sleep "$delay"
          done
          if [ "$count" != "1" ]; then
            echo "Artifact ${ARTIFACT_NAME} is not uniquely visible yet (count=${count})." >&2
            exit 1
          fi
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name || format('github-pages-{0}', github.run_attempt) }}
